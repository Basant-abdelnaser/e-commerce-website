<div class="auth-container">
  <!-- Animated background elements -->
  <div class="background-elements">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
  </div>

  <!-- Auth Card -->
  <div class="auth-card">
    <!-- Tab Switcher -->
    <div class="tab-switcher">
      <button [class.active]="isLogin" (click)="isLogin = true; resetForm()">Login</button>
      <button [class.active]="!isLogin" (click)="isLogin = false; resetForm()">Register</button>
    </div>

    <!-- Form Container -->
    <div class="form-container">
      <div class="form-header">
        <h2>{{ isLogin ? 'Welcome Back' : 'Create Account' }}</h2>
        <p>{{ isLogin ? 'Sign in to continue your journey' : 'Join us and start your journey' }}</p>
      </div>

      <div class="form-content">
        <!-- Username - Register Only -->
        <div class="input-group" *ngIf="!isLogin">
          <div class="input-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <input
            type="text"
            [(ngModel)]="formData.username"
            placeholder="Username"
            [required]="!isLogin"
          />
        </div>

        <!-- Email -->
        <div class="input-group">
          <div class="input-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              ></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <input type="email" [(ngModel)]="formData.email" placeholder="Email Address" required />
        </div>

        <!-- Phone - Register Only -->
        <div class="input-group" *ngIf="!isLogin">
          <div class="input-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
              ></path>
            </svg>
          </div>
          <input
            type="tel"
            [(ngModel)]="formData.phone"
            placeholder="Phone Number"
            [required]="!isLogin"
          />
        </div>

        <!-- Password -->
        <div class="input-group">
          <div class="input-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="formData.password"
            placeholder="Password"
            required
          />

          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
            <svg
              *ngIf="!showPassword"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg
              *ngIf="showPassword"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              ></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <!-- Forgot Password - Login Only -->
        <!-- <div class="forgot-password" *ngIf="isLogin">
          <a href="#">Forgot Password?</a>
        </div> -->

        <!-- Submit Button -->
        <button class="submit-btn" (click)="onSubmit()">
          {{ isLogin ? 'Sign In' : 'Create Account' }}
        </button>
      </div>
    </div>
    <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>
    <!-- Footer Text -->
    <div class="footer-text">
      <p>
        {{ isLogin ? "Don't have an account? " : 'Already have an account? ' }}
        <button (click)="toggleView()">
          {{ isLogin ? 'Sign up' : 'Sign in' }}
        </button>
      </p>
    </div>
  </div>
</div>
